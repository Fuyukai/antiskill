WARNING_FLAGS="-Werror=odr -Werror=lto-type-mismatch -Werror=strict-aliasing"  # from lto wiki page
COMMON_FLAGS="-O2 -pipe -march=native -mtune=native -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer -flto ${WARNING_FLAGS}"

PORTAGE_SCHEDULING_POLICY="idle"

CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="${LDFLAGS} -fuse-ld=mold"
RUSTFLAGS="-C target-cpu=native -C opt-level=3"

VIDEO_CARDS="nvidia"
ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE CeCILL-2.1 free-noncomm"
BINPKG_FORMAT="gpkg"
FEATURES="${FEATURES} binpkg-request-signature preserve-libs nostrip"

USE="-cet lto pgo"

LC_MESSAGES=C.utf8
GENTOO_MIRRORS="https://mirror.bytemark.co.uk/gentoo/"
